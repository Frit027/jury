<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Профиль участника</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="page page_profile">
            <div class="page__content">
                <div class="profile">
                    <div class="profile__photo">
                        <div class="photo photo_participant">
                            <div class="photo__window">
                                <img class="photo__image photo__image_participant" src="assets/images/participant.png" alt="Фото участника">
                            </div>
                        </div>
                    </div>
                    <span class="profile__button">Оценить</span>
                    <span class="sparkle sparkle_profile" aria-hidden="true">
                        <img class="sparkle__image" src="assets/images/sparkle-profile.svg" alt="">
                    </span>
                </div>
                <section class="info info_profile" aria-label="Данные участника">
                    <span class="info__decor" aria-hidden="true">
                        <img class="info__confetti" src="assets/images/confetti-profile.svg" alt="">
                    </span>
                    <dl class="info__fields">
                        <div class="info__field">
                            <dt class="info__label">Фамилия</dt>
                            <dd class="info__value">Кривоносов</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Имя</dt>
                            <dd class="info__value">Сергей</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Возраст</dt>
                            <dd class="info__value">15 лет</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Город</dt>
                            <dd class="info__value">Североморск</dd>
                        </div>
                    </dl>
                </section>
            </div>
            <footer class="footer">
                <img class="footer__logo" src="assets/images/logo.png" width="202" height="64" alt="Звезда родилась">
                <p class="footer__participant">Участник 07 / 24</p>
            </footer>
        </main>
    </body>
</html>
