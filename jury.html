<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Оценки жюри</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="page page_jury">
            <header class="page__header">
                <span class="brand">
                    <img class="brand__image" src="assets/images/logo.png" alt="">
                </span>
                <section class="info info_jury">
                    <dl class="info__fields">
                        <div class="info__field">
                            <dt class="info__label">Фамилия</dt>
                            <dd class="info__value">Кривоносов</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Имя</dt>
                            <dd class="info__value">Сергей</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Возраст</dt>
                            <dd class="info__value">15 лет</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Город</dt>
                            <dd class="info__value">Североморск</dd>
                        </div>
                    </dl>
                </section>
                <span class="brand">
                    <img class="brand__image" src="assets/images/logo.png" alt="">
                </span>
            </header>
            <ol class="jury">
                <li class="jury__card">
                    <div class="photo">
                        <div class="photo__window">
                            <img class="photo__image photo__image_jury-1" src="assets/images/jury-1.png" alt="Фото судьи 1">
                        </div>
                    </div>
                    <p class="jury__score">10</p>
                </li>
                <li class="jury__card">
                    <div class="photo">
                        <div class="photo__window">
                            <img class="photo__image photo__image_jury-2" src="assets/images/jury-2.png" alt="Фото судьи 2">
                        </div>
                    </div>
                    <p class="jury__score">9</p>
                </li>
                <li class="jury__card">
                    <div class="photo">
                        <div class="photo__window">
                            <img class="photo__image photo__image_jury-3" src="assets/images/jury-3.png" alt="Фото судьи 3">
                        </div>
                    </div>
                    <p class="jury__score">8</p>
                </li>
                <li class="jury__card">
                    <div class="photo">
                        <div class="photo__window">
                            <img class="photo__image photo__image_jury-4" src="assets/images/jury-4.png" alt="Фото судьи 4">
                        </div>
                    </div>
                    <p class="jury__score">9</p>
                </li>
                <li class="jury__card">
                    <div class="photo">
                        <div class="photo__window">
                            <img class="photo__image photo__image_jury-5" src="assets/images/jury-5.png" alt="Фото судьи 5">
                        </div>
                    </div>
                    <p class="jury__score">8</p>
                </li>
            </ol>
        </main>
    </body>
</html>
