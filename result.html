<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="dark">
        <title>Общий балл — Звезда родилась</title>
        <link rel="icon" href="data:,">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="page page_result" aria-label="Общий балл">
            <section class="total" aria-label="Сумма оценок жюри: 44">
                <div class="photo photo_total">
                    <div class="photo__window">
                        <img class="photo__image photo__image_total" src="assets/images/participant.png" alt="Фото участника">
                    </div>
                </div>
                <div class="total__text">
                    <h1 class="total__title">Общий балл</h1>
                    <p class="total__value">44</p>
                </div>
                <span class="sparkle sparkle_total" aria-hidden="true">
                    <img class="sparkle__image" src="assets/images/sparkle-total.svg" alt="">
                </span>
            </section>
            <span class="brand" aria-hidden="true">
                <img class="brand__image" src="assets/images/logo.png" alt="">
            </span>
            <section class="info info_result" aria-label="Данные участника">
                <dl class="info__fields">
                    <div class="info__field">
                        <dt class="info__label">Фамилия</dt>
                        <dd class="info__value">Кривоносов</dd>
                    </div>
                    <div class="info__field">
                        <dt class="info__label">Имя</dt>
                        <dd class="info__value">Сергей</dd>
                    </div>
                    <div class="info__field">
                        <dt class="info__label">Возраст</dt>
                        <dd class="info__value">15 лет</dd>
                    </div>
                    <div class="info__field">
                        <dt class="info__label">Город</dt>
                        <dd class="info__value">Североморск</dd>
                    </div>
                </dl>
            </section>
        </main>
    </body>
</html>
