<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Оценка участника</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="page page_mark">
            <section class="info info_mark">
                <span class="info__decor">
                    <img class="info__confetti" src="assets/images/confetti-mark.svg" alt="">
                </span>
                <div class="info__fields">
                    <dl class="info__column">
                        <div class="info__field">
                            <dt class="info__label">Фамилия</dt>
                            <dd class="info__value">Кривоносов</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Имя</dt>
                            <dd class="info__value">Сергей</dd>
                        </div>
                    </dl>
                    <dl class="info__column">
                        <div class="info__field">
                            <dt class="info__label">Возраст</dt>
                            <dd class="info__value">15 лет</dd>
                        </div>
                        <div class="info__field">
                            <dt class="info__label">Город</dt>
                            <dd class="info__value">Североморск</dd>
                        </div>
                    </dl>
                </div>
            </section>
            <fieldset class="scores">
                <div class="scores__row">
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="1">
                        <span class="score__face">
                            <span class="score__value">1</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="2">
                        <span class="score__face">
                            <span class="score__value">2</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="3">
                        <span class="score__face">
                            <span class="score__value">3</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="4">
                        <span class="score__face">
                            <span class="score__value">4</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="5">
                        <span class="score__face">
                            <span class="score__value">5</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                </div>
                <div class="scores__row">
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="6">
                        <span class="score__face">
                            <span class="score__value">6</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="7">
                        <span class="score__face">
                            <span class="score__value">7</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="8" checked>
                        <span class="score__face">
                            <span class="score__value">8</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="9">
                        <span class="score__face">
                            <span class="score__value">9</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                    <label class="score">
                        <input class="score__input" type="radio" name="score" value="10">
                        <span class="score__face">
                            <span class="score__value">10</span>
                            <span class="sparkle sparkle_score">
                                <img class="sparkle__image" src="assets/images/sparkle-score.svg" alt="">
                            </span>
                        </span>
                    </label>
                </div>
            </fieldset>
            <footer class="footer">
                <img class="footer__logo" src="assets/images/logo.png" alt="Звезда родилась">
                <p class="footer__participant">Участник 07 / 24</p>
            </footer>
        </main>
    </body>
</html>
